name: AI fingerprint

# `edited` is included so that correcting the PR body's footer re-runs the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Narrative proposal PRs are opened by the Narrative action with a fixed body, so they are
      # exempt. Both conditions are required: the branch prefix alone could be claimed by anyone,
      # while only the workflow token can author as github-actions[bot].
      - name: Detect narrative proposal PR
        id: exempt
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$HEAD_REF" in
            automation/narrative-pr-*)
              if [ "$AUTHOR" = "github-actions[bot]" ]; then
                echo "exempt=true" >> "$GITHUB_OUTPUT"
                echo "Narrative proposal PR opened by github-actions[bot]; fingerprint not required."
              fi
              ;;
          esac

      # PR_BODY is passed via env rather than interpolated into the script: it is untrusted text
      # and direct `${{ }}` interpolation into a run: block is a script-injection vector.
      - name: AI fingerprint check
        if: steps.exempt.outputs.exempt != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FINGERPRINT=$(printf '%s' "$PR_BODY" | grep -oE '^AI-Fingerprint: sha256:[0-9a-f]{12}$' | head -1 | sed -E 's/^AI-Fingerprint: sha256://' || true)
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::PR body is missing a valid 'AI-Fingerprint: sha256:<12 hex chars>' footer line. See AGENTS.md's AI fingerprint protocol."
            exit 1
          fi

          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          EXPECTED=$(git diff "$MERGE_BASE" "$HEAD_SHA" | sha256sum | cut -c1-12)

          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::AI-Fingerprint mismatch: PR body has sha256:$FINGERPRINT, expected sha256:$EXPECTED. Recompute after the last push (see AGENTS.md)."
            exit 1
          fi
