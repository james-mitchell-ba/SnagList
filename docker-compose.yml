services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snaglist
      POSTGRES_USER: snaglist
      POSTGRES_PASSWORD: snaglist
    ports:
      - "5433:5432"
    volumes:
      - snaglist-db-data:/var/lib/postgresql/data

  s3:
    build:
      context: ./deploy/home-lab/minio
      dockerfile: Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: snaglist
      MINIO_ROOT_PASSWORD: snaglist123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - snaglist-minio-data:/data

  s3-bootstrap:
    build:
      context: ./deploy/home-lab/minio
      dockerfile: mc.Dockerfile
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 snaglist snaglist123 2>/dev/null; do
        sleep 2
      done &&
      mc mb --ignore-existing local/snaglist-photos
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
      - "1026:1025"

  api:
    build:
      context: .
      dockerfile: src/SnagList.Api/Dockerfile
    depends_on:
      - db
      - s3
      - keycloak
    environment:
      ConnectionStrings__SnagList: "Host=db;Database=snaglist;Username=snaglist;Password=snaglist"
      Storage__BucketName: snaglist-photos
      Storage__AccessKey: snaglist
      Storage__SecretKey: snaglist123
      Storage__ServiceUrl: http://s3:9000
      Email__Host: mailpit
      Email__Port: "1025"
      Email__FromAddress: snaglist@example.com
      Email__UseTls: "false"
      Auth__Local__Authority: http://keycloak:8080/realms/snaglist
      Auth__Local__Audience: snaglist-api
      Auth__Local__AdditionalValidIssuer: http://localhost:8080/realms/snaglist
      Notifications__MaintenanceTeamEmail: maintenance@example.com
    ports:
      - "5080:8080"

  mcp:
    build:
      context: .
      dockerfile: src/SnagList.Mcp/Dockerfile
    depends_on:
      - db
      - s3
      - keycloak
    environment:
      ConnectionStrings__SnagList: "Host=db;Database=snaglist;Username=snaglist;Password=snaglist"
      Storage__BucketName: snaglist-photos
      Storage__AccessKey: snaglist
      Storage__SecretKey: snaglist123
      Storage__ServiceUrl: http://s3:9000
      Email__Host: mailpit
      Email__Port: "1025"
      Email__FromAddress: snaglist@example.com
      Email__UseTls: "false"
      Notifications__MaintenanceTeamEmail: maintenance@example.com
      Auth__Local__Authority: http://keycloak:8080/realms/snaglist
      Auth__Local__Audience: snaglist-api
      Auth__Local__AdditionalValidIssuer: http://localhost:8080/realms/snaglist
    ports:
      - "5090:8080"

  web:
    build:
      context: .
      dockerfile: src/SnagList.Web/Dockerfile
    ports:
      - "5081:8080"

  seed:
    build:
      context: .
      dockerfile: src/SnagList.SeedData/Dockerfile
    profiles: ["seed"]
    depends_on:
      - db
    environment:
      ConnectionStrings__SnagList: "Host=db;Database=snaglist;Username=snaglist;Password=snaglist"

volumes:
  snaglist-db-data:
  snaglist-minio-data:
